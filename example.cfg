[Wildcards]
# wildcards can be used in other places in the config
# $(wildcardname) will simply replace $(wildcardname) with 
# @(wildcardname) will create a new entry with every component of the wildcard list
# @(wildcardname1) @(wildcardname2) ... will create an entry with all combinations of wildcardname1, wildcardname2, ...
# explicitly set values always take precedent
coeffs = cW cHG cHbox cHDD cHWB cHW cHq1 cHq3 cHl1 cHl3 cHd cHu cll1 cld clu clq3

[General]
# output prefix
outname = test
# Coefficients of the theory
coeffs = cW cHG cHbox cHDD cHWB cHW cHq1 cHq3 cHl1 cHl3 cHd cHu cll1 cld clu clq3
# List of measurement configurations to be included 
measurement_configs = WW_ptl0.cfg

[Ranges]
# Allowed parameter ranges
@(coeffs) = -1e3 1e3



