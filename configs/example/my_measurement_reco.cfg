[Variables]    
file = histos/example/myfile_reco.root
coeffs = c1 c2 
exp_sys = jes lumi
theo_sys = pdf
backgrounds = fakes 
background_sys = jes

[Measurement]
name = my_measurement
measured = $(file):data   # for reco: data = number of events
sm = $(file):sm_NOMINAL   # reco level signal prediction 
reco_level = True

[Linear Effects]
@(coeffs) = $(file):@(coeffs)_NOMINAL 

[Quadratic Effects]
@(coeffs1) @(coeffs2) = $(file):@(coeffs1)_@(coeffs2)_NOMINAL

[Prediction Uncertainties] # on reco level, all uncertainties are prediction uncertaiones
{sm} @(exp_sys) = $(file):sm_@(exp_sys)_DOWN,$(file):sm_@(exp_sys)_UP
{@(coeffs)} @(exp_sys) = $(file):@(coeffs)_@(exp_sys)_DOWN,$(file):@(coeffs)_@(exp_sys)_UP
{all} @(theo_sys) = $(file):sm_@(theo_sys)_DOWN,$(file):sm_@(theo_sys)_UP

[Backgrounds]              # will typically have backgrounds on reco level
@(backgrounds) = $(file):@(backgrounds)_NOMINAL

[Background Uncertainties] # lots of uncertainties
{@(backgrounds)} @(background_sys) = $(file):@(backgrounds)_@(background_sys)_DOWN,$(file):@(backgrounds)_@(background_sys)_UP

