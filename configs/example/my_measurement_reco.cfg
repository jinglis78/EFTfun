[Variables]    
file = histos/example/myfile_reco.root
coeffs = c1 c2 
exp_sys = jes lumi
theo_sys = pdf
backgrounds = fakes 
background_sys = jes

[Measurement]
name = my_measurement
measured = $(file):data   
sm = $(file):sm_NOMINAL   
reco_level = True

[Linear Effects]
@(coeffs) = $(file):@(coeffs)_NOMINAL 

[Quadratic Effects]
@(coeffs1) @(coeffs2) = $(file):@(coeffs1)_@(coeffs2)_NOMINAL

[Prediction Uncertainties] 
{sm} @(exp_sys) = $(file):sm_@(exp_sys)_DOWN,$(file):sm_@(exp_sys)_UP
#{@(coeffs)} @(exp_sys) = $(file):@(coeffs)_@(exp_sys)_DOWN,$(file):@(coeffs)_@(exp_sys)_UP
{all} @(theo_sys) = $(file):sm_@(theo_sys)_DOWN,$(file):sm_@(theo_sys)_UP

[Backgrounds]              
@(backgrounds) = $(file):@(backgrounds)_NOMINAL

[Background Uncertainties] 
{@(backgrounds)} @(background_sys) = $(file):@(backgrounds)_@(background_sys)_DOWN,$(file):@(backgrounds)_@(background_sys)_UP

