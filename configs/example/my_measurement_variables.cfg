[Variables]
file = histos/example/myfile.root
coeffs = c1 c2
exp_sys = jes lumi
theo_sys = pdf

[Measurement]
name = my_measurement
measured = $(file):data_NOMINAL
sm = $(file):sm_NOMINAL
correlation = $(file):correlation
correlated_uncertainty = $(file):data_NOMINAL

[Linear Effects]
@(coeffs) = $(file):@(coeffs)

[Quadratic Effects]
@(coeffs1) @(coeffs2) = $(file):@(coeffs1)_@(coeffs2)

[Measurement Uncertainties]
@(exp_sys) = $(file):data_@(exp_sys)_DOWN,$(file):data_@(exp_sys)_UP

[Prediction Uncertainties]
{all} @(theo_sys) = $(file):sm_@(theo_sys)_DOWN,$(file):sm_@(theo_sys)_UP
