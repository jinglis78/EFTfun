[Measurement]
name = my_measurement
measured = histos/example/myfile.root:data_NOMINAL
sm = histos/example/myfile.root:sm_NOMINAL
correlation = histos/example/myfile.root:correlation
correlated_uncertainty = histos/example/myfile.root:data_NOMINAL

[Linear Effects]
c1 = histos/example/myfile.root:c1
c2 = histos/example/myfile.root:c2

[Quadratic Effects]
c1 c1 = histos/example/myfile.root:c1_c1
c2 c2 = histos/example/myfile.root:c2_c2
c1 c2 = histos/example/myfile.root:c1_c2

[Measurement Uncertainties]
jes = histos/example/myfile.root:data_jes_DOWN,histos/example/myfile.root:data_jes_UP
lumi = histos/example/myfile.root:data_lumi_DOWN,histos/example/myfile.root:data_lumi_UP

[Prediction Uncertainties]
pdf = histos/example/myfile.root:sm_pdf_DOWN,histos/example/myfile.root:sm_pdf_UP