[Measurement]
name = my_measurement             # unique name
measured = 60 50 30               # measured cross-section
sm = 60 45 25                     # sm prediction
correlation = 1 0 0, 0 1 0, 0 0 1 # correlation matrix
correlated_uncertainty = 8 7 5    # uncertainty corresponding
                                  # to corr matrix
[Linear Effects]
c1 = 10 10 10                     # linear effects in each bin
c2 = 6 4.5 2.5

[Quadratic Effects]
c1 c1 = 2 5 10                    # quadratic effects in each bin
c2 c2 = 0.6 0.45 0.25             # prediction in first bin is:
c1 c2 = 0. 0. 0.                  # 60 + 10*c1 + 6*c2 + 2*c1**2 + 0.6*c2**2

[Measurement Uncertainties]       # uncertainties not accounted for in "correlated_uncertainty"
jes = {abs} 5 3 2                 # can use both ways to write uncertainties or just one
lumi = {rel} 0.02                 # these will be added to other uncertainties 
                                  # option to use nuisance parameters exists, too
[Prediction Uncertainties]        
{all} pdf = {rel} -0.03,0.02 -0.02,0.03 -0.04,0.04   # uncertainty of the theory prediction 