[Variables]
coeffs = cW cHDD cHWB cHl1 cHl3 cHe cHq1 cHq3 cll cll1 clq1 clq3 cle cqe
coeffsEW = cWWWL2 cWL2 cBL2
histo = 1_h_mtWZ
hepdata = data12
hepdata_corr = data13
histos = histos/ATLAS_2019_I1720438/newmerged2/clean

[Measurement]
name = WZ_mT
#binning = 0 140 180 250 450 600 1000
measured = hepdata/HEPData-ins1720438-v1-yaml/$(hepdata).yaml
correlation = hepdata/HEPData-ins1720438-v1-yaml/$(hepdata_corr).yaml
correlated_uncertainty = hepdata/HEPData-ins1720438-v1-yaml/$(hepdata).yaml
#sm = histos/ATLAS_2019_I1720438/wz_powheg_k_1p18.root:ATLAS_2019_I1720438/$(histo)
sm = histos/ATLAS_2019_I1720438/newmerged/sherpa.yoda:/ATLAS_2019_I1720438/$(histo)
renorm_sm = $(histos)/SM_lllvj.yoda:/ATLAS_2019_I1720438/$(histo)
per_bin_width=False
stat_unc_threshold=0.2
#scaling_factor = mu_diboson

[Prediction Uncertainties]
{all} wz_ewk_correction =  {rel keepnorm exp} -0.00365 -0.0057 -0.00003 0.00857 -0.01769 -0.06972
{all} diboson_pdf = {rel keepnorm lin} 0.012
{all} wz_scale_norm = {rel keepnorm lin} 0.1
{all} wz_scale_shape = {rel keepnorm lin} 0 0 0 0 0.05 0.1


[Measurement Uncertainties]
diboson_el = {corr incov} hepdata/HEPData-ins1720438-v1-yaml/$(hepdata).yaml:sys,Electrons 
diboson_mu = {corr incov} hepdata/HEPData-ins1720438-v1-yaml/$(hepdata).yaml:sys,Muons
lumi = {corr incov} hepdata/HEPData-ins1720438-v1-yaml/$(hepdata).yaml:sys,lumi


[Linear Effects]
@(coeffs) = {abs renorm} $(histos)/MGPy8EG_N30NLOnoMPI_EFTAWU_lllvj_NPSQeq1_@(coeffs).yoda:/ATLAS_2019_I1720438/$(histo)

