name = ZZ_measurement

measured = $(path)/Results_$(distribution_unfolding).root:Nominal/Nominal_Unfolded

covariance = $(path)/SMTotalCovMatrices_$(distribution_cov).root:$(distribution_cov)/$(cov_type)

