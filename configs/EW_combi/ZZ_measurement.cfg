[Linear Corrections]
@(coeffs_prop) = {abs renorm} $(histos):$(histo)_linprop_@(coeffs_prop)_1

[Linear Effects]
@(coeffs) = {abs renorm} $(histos):$(histo)_lin_@(coeffs)_1

[Quadratic Effects]
