[Wildcards]
coeffs = cW cHDD cHWB cHl1 cHl3 cHe cHq1 cHq3 cll cll1 clq1 clq3 cle cqe

[Measurement]
name = WZ_mT
measured = hepdata/HEPData-ins1720438-v1-yaml/data12.yaml
correlation = hepdata/HEPData-ins1720438-v1-yaml/data13.yaml
correlated_uncertainty = hepdata/HEPData-ins1720438-v1-yaml/data12.yaml
sm = histos/ATLAS_2019_I1720438/wz_powheg_k_1p18.root:ATLAS_2019_I1720438/d12-x01-y01
renorm_sm = histos/ATLAS_2019_I1720438/wz_madgraph.root:ATLAS_2019_I1720438/d12-x01-y01
per_bin_width=True
stat_unc_threshold=0.2

[Theo Systs]
# dummy systematics

[Exp Systs]
# at the moment all uncertainties are covered by the correlation matrix and total error

[Linear Effects]
@(coeffs) = {abs renorm} histos/ATLAS_2019_I1720438/@(coeffs).root:/ATLAS_2019_I1720438/d12-x01-y01

[Quadratic Effects]
# no cross terms for now (2D fits thus only accurate if linearised)
@(coeffs1) @(coeffs1) = {abs renorm} histos/ATLAS_2019_I1720438/@(coeffs1)_@(coeffs1).root:/ATLAS_2019_I1720438/d12-x01-y01

