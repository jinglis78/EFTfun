[Variables]
coeffs = cW cHDD cHWB cHl1 cHl3 cHe cHq1 cHq3 cll cll1 clq1 clq3 cle cqe clq1
uncorr_unc = sys,uncor stat 
corr_unc = sys,unfold sys,Electrons sys,Muons sys,Jets sys,Red.\ Background sys,Irred.\ Background sys,Pileup sys,lumi

[Measurement]
name = WZ_mT
binning = 0 140 180 250 450 600 1000
measured = hepdata/HEPData-ins1720438-v1-yaml/data12.yaml
correlation = hepdata/HEPData-ins1720438-v1-yaml/data13.yaml
correlated_uncertainty = hepdata/HEPData-ins1720438-v1-yaml/data12.yaml
sm = histos/ATLAS_2019_I1720438/wz_powheg_k_1p18.root:ATLAS_2019_I1720438/d12-x01-y01
renorm_sm = histos/ATLAS_2019_I1720438/wz_madgraph.root:ATLAS_2019_I1720438/d12-x01-y01
per_bin_width=False
stat_unc_threshold=0.2

[Prediction Uncertainties]
# dummy systematics
#wz_norm = {rel} 0.022
diboson_norm = {rel keepnorm exp} 0.03
wz_acceptance = {rel keepnorm exp} 0.02
diboson_acceptance = {rel keepnorm exp} 0.02

[Measurement Uncertainties]
#@(corr_unc) =  {corr} hepdata/HEPData-ins1720438-v1-yaml/data12.yaml:@(corr_unc)
#@(uncorr_unc) =  {uncorr} hepdata/HEPData-ins1720438-v1-yaml/data12.yaml:@(uncorr_unc)


[Linear Effects]
@(coeffs) = {abs renorm} histos/ATLAS_2019_I1720438/@(coeffs).root:/ATLAS_2019_I1720438/d12-x01-y01

[Quadratic Effects]
# no cross terms for now (2D fits thus only accurate if linearised)
@(coeffs1) @(coeffs1) = {abs renorm} histos/ATLAS_2019_I1720438/@(coeffs1)_@(coeffs1).root:/ATLAS_2019_I1720438/d12-x01-y01

