[General]
# Name of the combination (mandatory)
name = WW_reco

# Coefficients of the theory, other than nuisance parameters
# For now it's only a signal strenght parameter mu, later we will want the EFT coefficients here instead, like this:
# coeffs = cHq1 cHq3 cHu cHd ...
coeffs = mu

# List of measurement configurations to be included, separated by space (only one config, this is not a combination -- though one could additional configs for CRs)
measurement_configs = WW_incl_htlep.cfg

# Default parameter range, if not specified otherwise below
default_range = -1000 1000

#[Ranges]
# Allowed parameter ranges (optional)
# parametername = lower_limit upper_limit
# Example:
# c1 = -5 5

#[Variables]
# Variables can be used in other places in the config (optional)
# $(variablename) will simply replace $(variablename) with the content of the variable
# @(variablename) will create a new entry with every component of the variable list
# @(variablename1) @(variablename2) ... will create an entry with all combinations of variablename1, variablename2, ...
# explicitly set values always take precedent
# Always check the expanded config (original_filename.cfg.exp)
#
# Examples:
# MyVariable = A B
# $(MyVariable) = 1
# will result in
# A B = 1
# @(MyVariable) = 1
# will result in
# A = 1
# B = 1
# @(MyVariable1) @(MyVariable2) = 1
# will result in
# A A = 1
# A B = 1
# B A = 1
# B B = 1
# @(MyVariable)_foo = @(MyVariable)_bar
# will result in
# A_foo = A_bar
# B_foo = B_bar

#[Reparameterization]
# Allows to perform a linear transformation of parameters
# For example, assume that the orginal parameters are ca and cb, then
# c1 = 0.7071 0.7071
# c2 = 0.7071 -0.7071
# corresponds to a reparametrization where c1 = 0.7071*ca  + 0.7071*cb and c2 = 0.7071*ca - 0.7071*cb
 