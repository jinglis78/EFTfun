[Variables]
# Here arbitrary variables can be defined
# They can be used in the other sections of the config with either of these two:
# $(VARIABLE) <-- this just evaluates the variable as a string
# @(VARIABLE) <-- this interprets the variable as an array
# For every fit an "expanded" config is produced named "CONFIGNAME.cfg.exp" -- this allows to check whether the variable handling was correct

# default histogram location (remember, this is just a variable that will be used below). It is possible to define other variables, e.g. efthistos, should those be at a different location
histos = histos/ww-fit-inputs/CutSRBVeto-lv_pt_sum-fit.root
# list of backgrounds (we will loop over this with the @(VARIABLE) syntax below
backgrounds = diboson fakes top zjets
# (several) lists of systematics
# the only reason this looks so complicated is that we have 8 (eight!) different ways to label up/down variations
oneside_syst = el_FF_BTagged el_FF_BVeto el_FF_noMET FF_EWSUBTR JET_JER_DataVsMC_MC16 JET_JER_EffectiveNP_1 JET_JER_EffectiveNP_10 JET_JER_EffectiveNP_11 JET_JER_EffectiveNP_12restTerm JET_JER_EffectiveNP_2 JET_JER_EffectiveNP_3 JET_JER_EffectiveNP_4 JET_JER_EffectiveNP_5 JET_JER_EffectiveNP_6 JET_JER_EffectiveNP_7 JET_JER_EffectiveNP_8 JET_JER_EffectiveNP_9 JetVeto MET_SoftTrk_ResoPara MET_SoftTrk_ResoPerp mu_FF_BTagged mu_FF_BVeto mu_FF_noMET NOMINAL OneJetIncl v_FF_SigSub v_lumi v_top_amc v_top_ds v_top_hf v_top_hw7 v_ttbar_xs v_ttH_xs v_ttW_xs v_ttZ_xs v_vv_xs v_vvv_xs v_wt_xs v_zjets_xs
syst__1downup = diboson_scale EG_SCALE_ALL EL_EFF_ID_CorrUncertaintyNP10 EL_EFF_ID_CorrUncertaintyNP11 EL_EFF_ID_CorrUncertaintyNP12 EL_EFF_ID_CorrUncertaintyNP13 EL_EFF_ID_CorrUncertaintyNP14 EL_EFF_ID_CorrUncertaintyNP15 EL_EFF_ID_CorrUncertaintyNP8 EL_EFF_ID_CorrUncertaintyNP9 EL_EFF_ID_SIMPLIFIED_UncorrUncertaintyNP17 EL_EFF_ID_SIMPLIFIED_UncorrUncertaintyNP8 EL_EFF_Reco_TOTAL_1NPCOR_PLUS_UNCOR FT_EFF_Eigen_B_0 FT_EFF_Eigen_B_1 FT_EFF_Eigen_B_2 FT_EFF_Eigen_C_0 FT_EFF_Eigen_C_1 FT_EFF_Eigen_C_2 FT_EFF_Eigen_Light_0 FT_EFF_Eigen_Light_1 FT_EFF_Eigen_Light_2 FT_EFF_Eigen_Light_3 FT_EFF_extrapolation FT_EFF_extrapolation_from_charm JET_BJES_Response JET_EffectiveNP_Detector1 JET_EffectiveNP_Mixed1 JET_EffectiveNP_Mixed2 JET_EffectiveNP_Modelling1 JET_EffectiveNP_Modelling2 JET_EffectiveNP_Statistical1 JET_EtaIntercalibration_Modelling JET_Flavor_Composition JET_Flavor_Response JET_JvtEfficiency JET_Pileup_OffsetMu JET_Pileup_OffsetNPV JET_Pileup_PtTerm JET_Pileup_RhoTopology MUON_EFF_ISO_SYS MUON_EFF_RECO_SYS MUON_ID MUON_SAGITTA_RESBIAS MUON_SCALE PRW_DATASF zjets_ckkw zjets_qsf
syst_1downup = STAT
syst_DOWNUP = hard hfb hfc isrfsr isrpdf scale var3c
systDOWNUP = el_nonclosure mu_nonclosure
systDownUp = MET_SoftTrk_Scale
systDNUP= Camp
systLoHi = v_top_fsr v_top_rad
# statistical uncertainties (from MC and CR, the data stat will be taken into account automatically)
stat_uncert = v_MC_STAT v_STAT_CR1b v_STAT_CR2b v_STAT_CRfakes v_STAT_CRtf
# If this variable is {sym} all systematics will be symmetrized. If variable is empty nothing will be symmetrized. Due to the naive interpolation of this code asymmetric uncertainties can lead to numerical issues.
sym = {sym}

[Measurement]
# some name
name = incl_htlep

# location of data distribution
measured = $(histos):NOMINAL/data

sm = $(histos):NOMINAL/signal

# This is mostly relevant for cross-setion measurements, where data is often normalized by binwidth
per_bin_width = False


# Arbitrary scaling functions can be defined here (parameters need to be given in "{}" and need to be defined in the "top configuration" as "coeffs".
# Either overall scaling or scaling per bin, separated by spaces
# Only to be used for effects that cannot be captured by linear/quadratic effect scheme below
# As a test we introduce an overall scaling factor here -- should be removed for the EFT fit
scaling_factor = {mu} 1+mu

# Bin edges, relevant for plots only (optional)
#binning =

# Reco level measurement (True/False)? Otherwise an unfolded measurement is assumed.
reco_level = True

[Prediction Uncertainties]
# As this is a reco level measurement, all uncertainties are prediction uncertainties (the data is just a data).
# For an unfolded measurement there are two types of uncertainties, those affecting the theory prediction and those affeting the data.
# All uncertainties in this section will be included in fit as nuisance parameters, the name of the parameter is given on the left-hand side
#
# Format can be yoda histo, root histo, list of numbers, or just one number for flat uncertainties.
#
# Down and up effects are separated by comma (for numbers symmetric errors are possible without comma).
# In the case of a histogram it is assumed that the difference of the systematic histogram to the SM is the systematic effect.
#
# The following keywords are possible on the right hand side in "{}":
# abs/rel: absolute or relative effect? (not valid for histogram systematics)
# renorm/keepnorm: renormalize with ratio of best/alternative prediction (for histograms systematics 'keepnorm' means comparison to sm while 'renorm' means comparison to alternative, typically lo, sm -- 'keepnorm' is default and usually the correct choice)
# exp/lin: exponential/linear interpolation of systematics
# flip: flip the direction of the uncertainty (relevant for combinations only, for a single measurement the diretion is arbitrary)
# sym: symmetrize the uncertainty (by calculating (up-down)/2)
#
# Left-hand side argument: list of affected eft coefficients (or pairs c1,c2) or "all" if the total prediction is affected, "sm" if only the sm
#
# Examples:
# {all} pdf = {rel keepnorm lin} 0.03 0.02 0.01
# {sm} scale_sm = {rel keepnorm lin} -0.05,0.04 -0.03,0.04 -0.1,0.1
# {all} some_hist_unc = {keepnorm lin} histos.root:some_unc_down,histos.root:some_unc_up
# {c1 c2} scale_unc_linear = {renorm lin} 0.05
# {c1,c1 c1,c2 c2,c2} scale_unc_squared = {renorm lin} 0.1
#
# This will expand to a long list of systematics (the @ synatic is used!), all affecting the sm prediction only, look at the *.cfg.exp config
# This only looks complicated because of the various ways we label up/down systematics
{sm} @(oneside_syst) = {sym} $(histos):@(oneside_syst)/signal
{sm} @(syst__1downup) = $(sym) $(histos):@(syst__1downup)__1down/signal,$(histos):@(syst__1downup)__1up/signal
{sm} @(syst_1downup) = $(sym) $(histos):@(syst_1downup)_1down/signal,$(histos):@(syst_1downup)_1up/signal
{sm} @(syst_DOWNUP) = $(sym) $(histos):@(syst_DOWNUP)_DOWN/signal,$(histos):@(syst_DOWNUP)_UP/signal
{sm} @(systDOWNUP) = $(sym) $(histos):@(systDOWNUP)DOWN/signal,$(histos):@(systDOWNUP)UP/signal
{sm} @(systDownUp) = $(sym) $(histos):@(systDownUp)Down/signal,$(histos):@(systDownUp)Up/signal
{sm} @(systDNUP) = $(sym) $(histos):@(systDNUP)DN/signal,$(histos):@(systDNUP)UP/signal
{sm} @(systLoHi) = $(sym) $(histos):@(systLoHi)Lo/signal,$(histos):@(systLoHi)Hi/signal
{sm} @(stat_uncert)_signal = {uncorr sym} $(histos):@(stat_uncert)/signal


[Backgrounds]
# List of backgrounds
@(backgrounds) = $(histos):NOMINAL/@(backgrounds)

[Background Uncertainties]
# Uncertainties, similar to Prediction/Measurement uncertainties, the affected background needs to be given on the left-hand-side
# Can be (pairs of) yoda/root histo or list of numbers
# Examples:
#{background1} background1_norm = {rel} 0.3
#{background1} background1_shape = background1_shapeDown.root:histo,background1_shapeUp.root:histo
# For multiple backgrounds the use of variables is helpful -- take a look at the *.cfg.exp config, this would have been a lot of typing!
{@(backgrounds)} @(oneside_syst) = {sym} $(histos):@(oneside_syst)/@(backgrounds)
{@(backgrounds)} @(syst__1downup) = $(sym) $(histos):@(syst__1downup)__1down/@(backgrounds),$(histos):@(syst__1downup)__1up/@(backgrounds)
{@(backgrounds)} @(syst_1downup) = $(sym) $(histos):@(syst_1downup)_1down/@(backgrounds),$(histos):@(syst_1downup)_1up/@(backgrounds)
{@(backgrounds)} @(syst_DOWNUP) = $(sym) $(histos):@(syst_DOWNUP)_DOWN/@(backgrounds),$(histos):@(syst_DOWNUP)_UP/@(backgrounds)
{@(backgrounds)} @(systDOWNUP) = $(sym) $(histos):@(systDOWNUP)DOWN/@(backgrounds),$(histos):@(systDOWNUP)UP/@(backgrounds)
{@(backgrounds)} @(systDownUp) = $(sym) $(histos):@(systDownUp)Down/@(backgrounds),$(histos):@(systDownUp)Up/@(backgrounds)
{@(backgrounds)} @(systDNUP) = $(sym) $(histos):@(systDNUP)DN/@(backgrounds),$(histos):@(systDNUP)UP/@(backgrounds)
{@(backgrounds)} @(systLoHi) = $(sym) $(histos):@(systLoHi)Lo/@(backgrounds),$(histos):@(systLoHi)Hi/@(backgrounds)
{@(backgrounds)} @(stat_uncert)_@(backgrounds) = {uncorr sym} $(histos):@(stat_uncert)/@(backgrounds)

#[Linear Effects]
# Linear EFT effects (optional)
# Can be yoda histo, root histo, or list of numbers
# The left hand side name needs to correspond to an eft coefficient name
# 
# The following keywords are possible, to be specified on the left hand side in "{}":
# abs/rel
# renorm/keepnorm
# See above for explanation
#
# Example:
# c1 = {abs renorm} histos_c1.yoda:/ATLAS_XYZ_I123/d01-x01-y01

#[Quadratic Effects]
# EFT effects quadratic in EFT coefficients (optional)
# See also description of linear effects 
# Two coefficients will be on the left hand side
#
# c1 c2 = {abs renorm} histos_c1_c2_interference.yoda:/ATLAS_XYZ_I123/d01-x01-y01
# c1 c1 = {abs renorm} histos_c1_squared.yoda:/ATLAS_XYZ_I123/d01-x01-y01


#[Linear Corrections]
# Linear corrections, similar to linear effects, but they will be added on top of the linear effect (e.g. for propagrator corrections)