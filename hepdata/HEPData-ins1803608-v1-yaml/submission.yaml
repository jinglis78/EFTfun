data_file: meas_ewzjj_SR_stat_corr.yaml
description: Statistical correlation between bins of the differential cross-section
  measurements of EW $Zjj$ production in the signal region ($N^\mathrm{gap}_\mathrm{jets}
  = 0$, $\xi_Z < 0.5$). The associated measured central values, statistical uncertainty
  magnitude and bin ranges are presented in Tables 1-4. The bins are presented in
  order such that for example mjj_bin_1 spans $m_{jj} \in (1000,1500)$ GeV (see Table
  1), while pT_ll_bin7 spans $p_\mathrm{T}^{ll} \in (200,275)$ GeV (see Table 3).
keywords:
- name: reactions
  values: [P P --> Z JET(S) X]
- name: observables
  values: [Results]
- name: cmenergies
  values: [13000.0]
- name: phrases
  values: [Z+jets, Zjj, Vector boson fusion, VBF, Differential cross section, statistical
      correlation]
