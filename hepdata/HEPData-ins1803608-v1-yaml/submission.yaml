additional_resources:
- {description: web page with auxiliary material, location: 'http://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HIGG-2017-11/'}
comment: 'CERN-LHC. Differential cross-section measurements for the electroweak production
  of two jets in association with a $Z$ boson. These measurements are sensitive to
  the vector-boson fusion production mechanism and provide a fundamental test of the
  gauge structure of the Standard Model. The analysis is performed using proton-proton
  collision data collected by ATLAS at a centre-of-mass energy of 13 TeV and an integrated
  luminosity of 139 fb$^{-1}$. The differential cross-sections are measured in the
  $Z \to \ell\ell$ decay channel ($\ell = e,mu$) as a function of four observables:
  the dijet invariant mass $m_{jj}$, the rapidity interval spanned by the two jets
  $|\Delta y_{jj}|$, the signed azimuthal angle between the two jets $\Delta\phi_{jj}$,
  and the transverse momentum of the dilepton pair $p_{\mathrm{T},\ell\ell}$. The
  data are corrected for the effects of detector inefficiency and resolution. The
  definition of the fiducial region can be found in Table 3 of the paper and are applied
  in the associated Rivet routine.'
hepdata_doi: 10.17182/hepdata.94218.v1
